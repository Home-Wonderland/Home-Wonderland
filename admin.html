<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - Home wonderland</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tajawal', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4">

  <div class="max-w-5xl mx-auto w-full space-y-6">
    <!-- Header -->
    <div class="bg-white rounded-xl shadow-sm p-4 border border-slate-200 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="h-12 w-12 flex items-center justify-center shrink-0">
          <img src="WhatsApp Image 2026-09-25 at 18.32.28.jpeg" alt="Logo" class="max-h-full max-w-full object-contain">
        </div>
        <div>
          <h1 class="text-xl font-bold text-slate-800">Home wonderland</h1>
          <p class="text-xs font-semibold text-sky-600">لوحة إدارة وتتبع الشحنات الحية</p>
        </div>
      </div>
    </div>

    <!-- Form Section -->
    <div class="bg-white rounded-xl shadow-sm p-6 border border-slate-200">
      <h2 class="text-lg font-bold text-slate-800 mb-4 pb-2 border-b flex items-center gap-2">
        <i class="fa-solid fa-box-archive text-sky-600"></i> إضافة / تعديل شحنة
      </h2>

      <form id="shipmentForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">رقم الشحنة (Tracking Code)</label>
          <input type="text" id="shipCode" required class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-sky-500 outline-none" placeholder="مثال: SH-1001">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">اسم الزبون (مخفي للعملاء)</label>
          <input type="text" id="shipCustomer" required class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-sky-500 outline-none" placeholder="اسم الزبون">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">نوع الشحن</label>
          <select id="shipType" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-sky-500 outline-none">
            <option value="Sea">بحري 🚢</option>
            <option value="Air">جوي ✈️</option>
            <option value="Land">بري 🚚</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">المسار (من ➔ إلى)</label>
          <div class="flex gap-2">
            <input type="text" id="shipFrom" placeholder="من" required class="w-1/2 border rounded-lg p-2.5 text-sm outline-none">
            <input type="text" id="shipTo" placeholder="إلى" required class="w-1/2 border rounded-lg p-2.5 text-sm outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">الموقع الحالي للشحنة</label>
          <input type="text" id="shipLoc" required class="w-full border rounded-lg p-2.5 text-sm outline-none" placeholder="مثال: ميناء أم قصر">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">تاريخ التحديث (Last Update)</label>
          <input type="text" id="shipLastUpdate" required class="w-full border rounded-lg p-2.5 text-sm outline-none">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">عدد الطرود / الوزن</label>
          <input type="text" id="shipPackages" placeholder="مثال: 12 Cartons / 450 Kg" required class="w-full border rounded-lg p-2.5 text-sm outline-none">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">حالة الشحنة العامة</label>
          <select id="shipStatus" class="w-full border rounded-lg p-2.5 text-sm outline-none">
            <option value="تم استلام الشحنة 📦">تم استلام الشحنة 📦</option>
            <option value="قيد الشحن والتصديق 🚢">قيد الشحن والتصديق 🚢</option>
            <option value="وصلت الميناء/المطار 🛬">وصلت الميناء/المطار 🛬</option>
            <option value="قيد التخليص الجمركي 📑">قيد التخليص الجمركي 📑</option>
            <option value="جاهزة للتسليم/التسليم جاري 🚚">جاهزة للتسليم/التسليم جاري 🚚</option>
            <option value="تم التسليم بنجاح ✅">تم التسليم بنجاح ✅</option>
          </select>
        </div>

        <div class="md:col-span-2">
          <label class="block text-xs font-bold text-slate-600 mb-1">وصف أو ملاحظات للحالة</label>
          <input type="text" id="shipStatusDesc" class="w-full border rounded-lg p-2.5 text-sm outline-none" placeholder="مثال: UNDER CLEARANCE">
        </div>

        <div class="md:col-span-2">
          <button type="submit" id="saveBtn" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold p-3 rounded-lg shadow transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-floppy-disk"></i> حفظ الشحنة
          </button>
        </div>
      </form>
    </div>

    <!-- Table Section -->
    <div class="bg-white rounded-xl shadow-sm p-6 border border-slate-200 overflow-x-auto">
      <h2 class="text-lg font-bold text-slate-800 mb-4 pb-2 border-b">قائمة الشحنات الحالية</h2>
      <table class="w-full text-right text-sm">
        <thead class="bg-slate-50 text-slate-600 border-b">
          <tr>
            <th class="p-3">رقم الشحنة</th>
            <th class="p-3">اسم الزبون</th>
            <th class="p-3">نوع الشحن</th>
            <th class="p-3">المسار</th>
            <th class="p-3">الموقع الحالي</th>
            <th class="p-3">الحالة</th>
            <th class="p-3 text-center">إجراءات</th>
          </tr>
        </thead>
        <tbody id="shipmentTableBody">
          <!-- Live Data from Firebase -->
        </tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBAIoX7icGAK8pIMspYba58SfO5O6cOabY",
      authDomain: "home-wonderland.firebaseapp.com",
      databaseURL: "https://home-wonderland-default-rtdb.firebaseio.com",
      projectId: "home-wonderland",
      storageBucket: "home-wonderland.firebasestorage.app",
      messagingSenderId: "911419710716",
      appId: "1:911419710716:web:9ba36be5dd456b9f81cb79"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    function getTodayDate() {
      const today = new Date();
      const dd = String(today.getDate()).padStart(2, '0');
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const yyyy = today.getFullYear();
      return dd + '/' + mm + '/' + yyyy;
    }

    const dateInput = document.getElementById('shipLastUpdate');
    if (dateInput) dateInput.value = getTodayDate();

    // جلب وتحديث الجدول من Firebase حياً
    const tableBody = document.getElementById('shipmentTableBody');
    const shipmentsRef = ref(db, 'shipments');

    onValue(shipmentsRef, (snapshot) => {
      tableBody.innerHTML = '';
      const shipments = snapshot.val();
      if (shipments) {
        Object.keys(shipments).forEach(code => {
          const item = shipments[code];
          const typeText = item.shipmentType === 'Air' ? 'جوي ✈️' : (item.shipmentType === 'Sea' ? 'بحري 🚢' : 'بري 🚚');

          const row = document.createElement('tr');
          row.className = "border-b border-slate-100 hover:bg-slate-50";
          row.innerHTML = `
            <td class="p-3 font-bold text-sky-600">${code}</td>
            <td class="p-3 font-semibold text-amber-700">${item.customerName || '-'}</td>
            <td class="p-3 text-medium">${typeText}</td>
            <td class="p-3">${item.from || '-'} ➔ ${item.to || '-'}</td>
            <td class="p-3"><span class="bg-slate-100 text-slate-800 px-2 py-1 rounded text-xs">${item.currentLoc || '-'}</span></td>
            <td class="p-3 text-xs font-bold text-slate-600">${item.status || '-'}</td>
            <td class="p-3 text-center">
              <button onclick="editShipment('${code}')" class="bg-amber-500 text-white px-2 py-1 rounded text-xs ml-1">تعديل</button>
              <button onclick="deleteShipment('${code}')" class="bg-red-500 text-white px-2 py-1 rounded text-xs">حذف</button>
            </td>
          `;
          tableBody.appendChild(row);
        });
      }
    });

    // حفظ الشحنة في Firebase
    const form = document.getElementById('shipmentForm');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const trackingCode = document.getElementById('shipCode').value.trim();
      if (!trackingCode) {
        alert("يرجى إدخال رقم الشحنة");
        return;
      }

      const shipmentData = {
        customerName: document.getElementById('shipCustomer').value,
        shipmentType: document.getElementById('shipType').value,
        from: document.getElementById('shipFrom').value,
        to: document.getElementById('shipTo').value,
        currentLoc: document.getElementById('shipLoc').value,
        status: document.getElementById('shipStatus').value,
        statusDesc: document.getElementById('shipStatusDesc')?.value || '',
        lastUpdate: document.getElementById('shipLastUpdate').value || getTodayDate(),
        packages: document.getElementById('shipPackages').value
      };

      set(ref(db, 'shipments/' + trackingCode), shipmentData)
        .then(() => {
          alert("تم حفظ الشحنة بنجاح في قاعدة البيانات الحية!");
          form.reset();
          if (dateInput) dateInput.value = getTodayDate();
        })
        .catch((error) => alert("حدث خطأ: " + error.message));
    });

    window.deleteShipment = function(code) {
      if (confirm("هل تريد حذف الشحنة: " + code + "؟")) {
        remove(ref(db, 'shipments/' + code));
      }
    };

    window.editShipment = function(code) {
      onValue(ref(db, 'shipments/' + code), (snapshot) => {
        const item = snapshot.val();
        if (item) {
          document.getElementById('shipCode').value = code;
          document.getElementById('shipCustomer').value = item.customerName || '';
          document.getElementById('shipType').value = item.shipmentType || 'Sea';
          document.getElementById('shipFrom').value = item.from || '';
          document.getElementById('shipTo').value = item.to || '';
          document.getElementById('shipLoc').value = item.currentLoc || '';
          document.getElementById('shipStatus').value = item.status || '';
          if(document.getElementById('shipStatusDesc')) document.getElementById('shipStatusDesc').value = item.statusDesc || '';
          document.getElementById('shipLastUpdate').value = item.lastUpdate || getTodayDate();
          document.getElementById('shipPackages').value = item.packages || '';
        }
      }, { onlyOnce: true });
    };
  </script>
</body>
</html>
