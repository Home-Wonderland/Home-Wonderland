<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - Home Wonderland</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; color: #0f172a; }
  </style>
</head>
<body class="min-h-screen bg-slate-50 flex flex-col justify-between">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <div class="flex items-center space-x-3 space-x-reverse">
        <img src="WhatsApp Image 2026-09-25 at 18.32.28.jpeg" alt="Logo" class="h-10 object-contain">
        <span class="text-xl font-bold text-slate-900">Home Wonderland</span>
      </div>
      <span class="text-xs font-bold bg-slate-100 text-slate-600 px-3 py-1.5 rounded-full border border-slate-200">
        لوحة التحكم - Admin Panel
      </span>
    </div>
  </header>

  <main class="flex-grow max-w-5xl w-full mx-auto px-4 py-10 space-y-10">
    
    <!-- قسم إضافة / تحديث شحنة -->
    <div class="bg-white p-6 md:p-8 rounded-2xl border border-slate-200 shadow-sm space-y-6">
      <div class="flex items-center justify-between border-b border-slate-100 pb-4">
        <div>
          <h1 class="text-xl font-extrabold text-slate-900">إضافة أو تحديث شحنة</h1>
          <p class="text-xs text-slate-500 mt-1">أدخل بيانات الشحنة للبحث بواسطة B/L أو PO Number</p>
        </div>
        <i class="fa-solid fa-boxes-packing text-2xl text-sky-600"></i>
      </div>

      <form id="shipmentForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-2">رقم البوليصة (B/L Number) *</label>
          <input type="text" id="trackingCode" required placeholder="e.g. BL12345678" class="w-full bg-slate-50 text-slate-900 border border-slate-300 focus:border-sky-500 rounded-lg px-4 py-2.5 text-sm outline-none text-left" dir="ltr">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-2">رقم أمر الشراء (PO Number)</label>
          <input type="text" id="poNumber" placeholder="e.g. PO-987654" class="w-full bg-slate-50 text-slate-900 border border-slate-300 focus:border-sky-500 rounded-lg px-4 py-2.5 text-sm outline-none text-left" dir="ltr">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-2">اسم العميل (اختياري)</label>
          <input type="text" id="customerName" placeholder="e.g. Al-Muntazar Co." class="w-full bg-slate-50 text-slate-900 border border-slate-300 focus:border-sky-500 rounded-lg px-4 py-2.5 text-sm outline-none text-left" dir="ltr">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-2">مكان الشحن الأصلي (Shipped From)</label>
          <input type="text" id="fromLoc" placeholder="e.g. Xiamen Port, China" class="w-full bg-slate-50 text-slate-900 border border-slate-300 focus:border-sky-500 rounded-lg px-4 py-2.5 text-sm outline-none text-left" dir="ltr">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-2">الوجهة النهائية (Shipped To)</label>
          <input type="text" id="toLoc" placeholder="e.g. Umm Qasr Port, Iraq" class="w-full bg-slate-50 text-slate-900 border border-slate-300 focus:border-sky-500 rounded-lg px-4 py-2.5 text-sm outline-none text-left" dir="ltr">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-2">الموقع الحالي الآن (Current Location)</label>
          <input type="text" id="currentLoc" placeholder="e.g. Arar Border / Basra" class="w-full bg-slate-50 text-slate-900 border border-slate-300 focus:border-sky-500 rounded-lg px-4 py-2.5 text-sm outline-none text-left" dir="ltr">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-2">نوع الشحن (Shipment Type)</label>
          <select id="shipmentType" class="w-full bg-slate-50 text-slate-900 border border-slate-300 focus:border-sky-500 rounded-lg px-4 py-2.5 text-sm outline-none font-medium">
            <option value="Sea Freight">شحن بحري (Sea Freight)</option>
            <option value="Air Freight">شحن جوي (Air Freight)</option>
            <option value="Land Freight">شحن بري (Land Freight)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-2">تاريخ التحديث (Update Date)</label>
          <input type="date" id="lastUpdate" class="w-full bg-slate-50 text-slate-900 border border-slate-300 focus:border-sky-500 rounded-lg px-4 py-2.5 text-sm outline-none">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-2">عدد الطرود / الوزن (Packages / Weight)</label>
          <input type="text" id="packages" placeholder="e.g. 12 Cartons / 450 Kg" class="w-full bg-slate-50 text-slate-900 border border-slate-300 focus:border-sky-500 rounded-lg px-4 py-2.5 text-sm outline-none text-left" dir="ltr">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-2">حالة الشحنة (Shipment Status)</label>
          <select id="status" class="w-full bg-slate-50 text-slate-900 border border-slate-300 focus:border-sky-500 rounded-lg px-4 py-2.5 text-sm outline-none font-medium">
            <option value="Shipment Received">Shipment Received</option>
            <option value="In Transit">In Transit</option>
            <option value="Arrived at Port">Arrived at Port</option>
            <option value="Under Customs Clearance">Under Customs Clearance</option>
            <option value="Out for Delivery">Out for Delivery</option>
            <option value="Delivered Successfully">Delivered Successfully</option>
          </select>
        </div>

        <div class="md:col-span-2">
          <label class="block text-xs font-bold text-slate-700 uppercase mb-2">ملاحظات الحدث الحالي (اختياري - لا تظهر إن كانت فارغة)</label>
          <textarea id="statusDesc" rows="3" placeholder="ملاحظة أو تفاصيل إضافية للزبون..." class="w-full bg-slate-50 text-slate-900 border border-slate-300 focus:border-sky-500 rounded-lg px-4 py-2.5 text-sm outline-none text-left" dir="ltr"></textarea>
        </div>

        <div class="md:col-span-2 pt-2">
          <button type="submit" id="saveBtn" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 px-6 rounded-xl transition flex items-center justify-center gap-2 shadow-sm">
            <i class="fa-solid fa-plus-circle"></i>
            <span>حفظ / تحديث الشحنة</span>
          </button>
        </div>

      </form>
    </div>

    <!-- قسم الشحنات المضافة سابقاً -->
    <div class="bg-white p-6 md:p-8 rounded-2xl border border-slate-200 shadow-sm space-y-4">
      <div class="flex items-center justify-between border-b border-slate-100 pb-4">
        <h2 class="text-lg font-bold text-slate-900">قائمة الشحنات المضافة</h2>
        <span id="shipmentCount" class="text-xs font-bold bg-sky-50 text-sky-700 px-3 py-1 rounded-full border border-sky-100">0 شحنة</span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-sm text-right text-slate-600">
          <thead class="text-xs text-slate-700 uppercase bg-slate-100">
            <tr>
              <th class="px-4 py-3">رقم B/L</th>
              <th class="px-4 py-3">رقم PO</th>
              <th class="px-4 py-3">الموقع الحالي</th>
              <th class="px-4 py-3">الحالة</th>
              <th class="px-4 py-3">آخر تحديث</th>
            </tr>
          </thead>
          <tbody id="shipmentsTableBody">
            <tr>
              <td colspan="5" class="text-center py-6 text-slate-400">جاري تحميل الشحنات...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500 font-medium">
    Mariam Basim s.A
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBAIoX7icGAK8pIMspYba58SfO5O6cOabY",
      authDomain: "home-wonderland.firebaseapp.com",
      databaseURL: "https://home-wonderland-default-rtdb.firebaseio.com",
      projectId: "home-wonderland",
      storageBucket: "home-wonderland.firebasestorage.app",
      messagingSenderId: "911419710716",
      appId: "1:911419710716:web:9ba36be5dd456b9f81cb79"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    document.getElementById('lastUpdate').value = new Date().toISOString().split('T')[0];

    // حفظ / تحديث الشحنة
    document.getElementById('shipmentForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const trackingCode = document.getElementById('trackingCode').value.trim();
      const poNumber = document.getElementById('poNumber').value.trim();
      if (!trackingCode) { alert("يرجى إدخال رقم B/L للشحنة."); return; }

      const statusDescText = document.getElementById('statusDesc').value.trim();

      const newEvent = {
        date: document.getElementById('lastUpdate').value,
        location: document.getElementById('currentLoc').value.trim() || "In Transit",
        status: document.getElementById('status').value,
        desc: statusDescText
      };

      const shipmentRef = ref(db, 'shipments/' + trackingCode);

      try {
        const snapshot = await get(shipmentRef);
        let existingEvents = [];

        if (snapshot.exists()) {
          const oldData = snapshot.val();
          if (oldData.timelineEvents && Array.isArray(oldData.timelineEvents)) {
            existingEvents = oldData.timelineEvents;
          }
        }

        const updatedTimeline = [newEvent, ...existingEvents];

        const shipmentData = {
          trackingCode: trackingCode,
          poNumber: poNumber,
          customerName: document.getElementById('customerName').value.trim(),
          from: document.getElementById('fromLoc').value.trim(),
          to: document.getElementById('toLoc').value.trim(),
          currentLoc: document.getElementById('currentLoc').value.trim(),
          shipmentType: document.getElementById('shipmentType').value,
          lastUpdate: document.getElementById('lastUpdate').value,
          packages: document.getElementById('packages').value.trim(),
          status: document.getElementById('status').value,
          statusDesc: statusDescText,
          timelineEvents: updatedTimeline
        };

        await set(shipmentRef, shipmentData);
        alert("تم حفظ الشحنة وتحديث الخط الزمني بنجاح!");
        document.getElementById('statusDesc').value = '';

      } catch (err) {
        console.error(err);
        alert("حدث خطأ أثناء الحفظ.");
      }
    });

    // جلب وعرض قائمة الشحنات المضافة أسفل الصفحة
    const shipmentsRef = ref(db, 'shipments');
    onValue(shipmentsRef, (snapshot) => {
      const tableBody = document.getElementById('shipmentsTableBody');
      const countLabel = document.getElementById('shipmentCount');
      
      if (snapshot.exists()) {
        const data = snapshot.val();
        const keys = Object.keys(data);
        countLabel.textContent = `${keys.length} شحنة`;
        tableBody.innerHTML = '';

        keys.forEach(key => {
          const item = data[key];
          const row = document.createElement('tr');
          row.className = "border-b border-slate-100 hover:bg-slate-50";
          row.innerHTML = `
            <td class="px-4 py-3 font-bold text-slate-900" dir="ltr">${item.trackingCode || key}</td>
            <td class="px-4 py-3 text-slate-600" dir="ltr">${item.poNumber || '-'}</td>
            <td class="px-4 py-3" dir="ltr">${item.currentLoc || '-'}</td>
            <td class="px-4 py-3"><span class="bg-emerald-50 text-emerald-700 text-xs px-2 py-1 rounded font-medium">${item.status || '-'}</span></td>
            <td class="px-4 py-3 text-xs text-slate-500" dir="ltr">${item.lastUpdate || '-'}</td>
          `;
          tableBody.appendChild(row);
        });
      } else {
        countLabel.textContent = `0 شحنة`;
        tableBody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-slate-400">لا توجد شحنات مضافة حتى الآن.</td></tr>`;
      }
    });
  </script>
</body>
</html>
