<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home wonderland - Tracking</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tajawal', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 flex flex-col items-center">

  <div class="max-w-md w-full space-y-6">
    <!-- Header -->
    <div class="bg-white rounded-xl shadow-sm p-4 border border-slate-200 flex items-center gap-3">
      <div class="h-10 w-10 flex items-center justify-center shrink-0">
        <img src="WhatsApp Image 2026-09-25 at 18.32.28.jpeg" alt="Logo" class="max-h-full max-w-full object-contain">
      </div>
      <div>
        <h1 class="text-lg font-bold text-slate-800">Home wonderland</h1>
        <p class="text-xs font-semibold text-sky-600">Logistics & Express Cargo</p>
      </div>
    </div>

    <!-- Search Box -->
    <div class="bg-white rounded-2xl shadow-sm p-6 border border-slate-200 text-center space-y-4">
      <h2 class="text-xl font-bold text-slate-800">Track Your Shipment</h2>
      <p class="text-xs text-slate-400">Enter your tracking number below to see live updates</p>
      
      <div class="space-y-3">
        <input type="text" id="trackingInput" placeholder="Enter Tracking Number" class="w-full border rounded-xl p-3 text-center text-sm font-semibold text-slate-700 outline-none focus:ring-2 focus:ring-sky-500">
        <button id="trackBtn" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold p-3 rounded-xl shadow transition flex items-center justify-center gap-2">
          Track <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </div>
    </div>

    <!-- Result Card -->
    <div id="resultCard" class="hidden bg-white rounded-2xl shadow-sm p-6 border border-slate-200 space-y-5">
      <div class="flex justify-between items-center text-xs text-slate-400 font-bold border-b pb-3">
        <div>
          <span>TRACKING CODE: </span>
          <span id="resCodeDisplay" class="text-slate-700 font-extrabold"></span>
        </div>
        <div>
          <i class="fa-regular fa-clock"></i> <span id="resDate"></span>
        </div>
      </div>

      <!-- Origin & Destination -->
      <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 flex justify-between items-center text-center">
        <div>
          <span class="text-[10px] font-bold text-slate-400 block"><i class="fa-solid fa-circle text-emerald-500"></i> ORIGIN</span>
          <span id="resFrom" class="font-bold text-slate-800 text-sm"></span>
        </div>
        <div class="text-slate-300">|</div>
        <div>
          <span class="text-[10px] font-bold text-slate-400 block"><i class="fa-solid fa-location-dot text-rose-500"></i> DESTINATION</span>
          <span id="resTo" class="font-bold text-slate-800 text-sm"></span>
        </div>
      </div>

      <!-- Current Location Box -->
      <div class="bg-sky-600 text-white p-4 rounded-xl flex items-center justify-between shadow-md">
        <div class="flex items-center gap-3">
          <div class="bg-white/20 p-2.5 rounded-lg">
            <i class="fa-solid fa-truck-fast text-xl"></i>
          </div>
          <div>
            <span class="text-xs text-sky-100 block font-semibold">Current Location</span>
            <span id="resLoc" class="text-lg font-bold block mt-0.5"></span>
          </div>
        </div>
        <span class="bg-white/20 text-xs px-2.5 py-1 rounded-full font-bold">● Live</span>
      </div>

      <!-- Packages -->
      <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
        <span class="text-[10px] font-bold text-slate-400 block">PACKAGES / WEIGHT</span>
        <span id="resPackages" class="font-bold text-slate-800 text-sm"></span>
      </div>

      <!-- Status Details -->
      <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 space-y-1">
        <span class="text-[10px] font-bold text-slate-400 block">STATUS DETAILS</span>
        <div id="resStatus" class="font-bold text-slate-800 text-sm"></div>
        <div id="resStatusDesc" class="text-xs text-slate-500"></div>
      </div>
    </div>

    <div class="text-center text-xs text-slate-400">
      All rights reserved © Mariam Basim S.A
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBAIoX7icGAK8pIMspYba58SfO5O6cOabY",
      authDomain: "home-wonderland.firebaseapp.com",
      databaseURL: "https://home-wonderland-default-rtdb.firebaseio.com",
      projectId: "home-wonderland",
      storageBucket: "home-wonderland.firebasestorage.app",
      messagingSenderId: "911419710716",
      appId: "1:911419710716:web:9ba36be5dd456b9f81cb79"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.addEventListener('DOMContentLoaded', () => {
      const trackBtn = document.getElementById('trackBtn');
      const trackingInput = document.getElementById('trackingInput');

      if (trackBtn) {
        trackBtn.addEventListener('click', (e) => {
          e.preventDefault();
          const code = trackingInput ? trackingInput.value.trim() : '';
          if (!code) {
            alert("Please enter tracking number");
            return;
          }

          get(child(ref(db), 'shipments')).then((snapshot) => {
            if (snapshot.exists()) {
              const shipments = snapshot.val();
              const matchedKey = Object.keys(shipments).find(
                k => k.trim().toLowerCase() === code.toLowerCase()
              );

              if (matchedKey) {
                const data = shipments[matchedKey];
                
                if (document.getElementById('resCodeDisplay')) document.getElementById('resCodeDisplay').innerText = matchedKey;
                if (document.getElementById('resFrom')) document.getElementById('resFrom').innerText = data.from || '-';
                if (document.getElementById('resTo')) document.getElementById('resTo').innerText = data.to || '-';
                if (document.getElementById('resLoc')) document.getElementById('resLoc').innerText = data.currentLoc || '-';
                if (document.getElementById('resStatus')) document.getElementById('resStatus').innerText = data.status || '-';
                if (document.getElementById('resDate')) document.getElementById('resDate').innerText = data.lastUpdate || '-';
                if (document.getElementById('resPackages')) document.getElementById('resPackages').innerText = data.packages || '-';
                if (document.getElementById('resStatusDesc')) document.getElementById('resStatusDesc').innerText = data.statusDesc || '-';

                const resultCard = document.getElementById('resultCard');
                if (resultCard) {
                  resultCard.classList.remove('hidden');
                }
              } else {
                alert("رقم الشحنة غير موجود، يرجى التأكد من الرقم والبحث مجدداً.");
              }
            } else {
              alert("لا توجد شحنات مسجلة حالياً.");
            }
          }).catch((error) => {
            alert("حدث خطأ أثناء جلب البيانات.");
          });
        });
      }
    });
  </script>
</body>
</html>
