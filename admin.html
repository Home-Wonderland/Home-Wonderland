<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - Home Wonderland</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; color: #0f172a; }
  </style>
</head>
<body class="min-h-screen bg-slate-50 flex flex-col justify-between">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <div class="flex items-center space-x-3 space-x-reverse">
        <img src="WhatsApp Image 2026-09-25 at 18.32.28.jpeg" alt="Logo" class="h-10 object-contain">
        <span class="text-xl font-bold text-slate-900">Home Wonderland</span>
      </div>
      <span class="text-xs font-bold bg-slate-100 text-slate-600 px-3 py-1.5 rounded-full border border-slate-200">
        لوحة التحكم - Admin Panel
      </span>
    </div>
  </header>

  <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-10 space-y-8">
    <div class="flex items-center justify-between border-b border-slate-200 pb-5">
      <div>
        <h1 class="text-2xl font-extrabold text-slate-900">إضافة / تحديث محطة لشحنة</h1>
        <p class="text-xs text-slate-500 mt-1">عند حفظ نفس رقم الشحنة، سيتم إضافة التحديث الجديد للخط الزمني تلقائياً</p>
      </div>
      <i class="fa-solid fa-boxes-packing text-2xl text-sky-600"></i>
    </div>

    <div class="bg-white p-6 md:p-8 rounded-2xl border border-slate-200 shadow-sm space-y-6">
      <form id="shipmentForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-2">رقم الشحنة (B/L or PO No) *</label>
          <input type="text" id="trackingCode" required placeholder="e.g. 4502516358" class="w-full bg-slate-50 text-slate-900 border border-slate-300 focus:border-sky-500 rounded-lg px-4 py-2.5 text-sm outline-none text-left" dir="ltr">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-2">اسم الزبون (مخفي)</label>
          <input type="text" id="customerName" placeholder="e.g. Al-Muntazar Co." class="w-full bg-slate-50 text-slate-900 border border-slate-300 focus:border-sky-500 rounded-lg px-4 py-2.5 text-sm outline-none text-left" dir="ltr">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-2">مكان الشحن الأصلي (Shipped From)</label>
          <input type="text" id="fromLoc" placeholder="e.g. Xiamen Port, China" class="w-full bg-slate-50 text-slate-900 border border-slate-300 focus:border-sky-500 rounded-lg px-4 py-2.5 text-sm outline-none text-left" dir="ltr">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-2">الوجهة النهائية (Shipped To)</label>
          <input type="text" id="toLoc" placeholder="e.g. Umm Qasr Port, Iraq" class="w-full bg-slate-50 text-slate-900 border border-slate-300 focus:border-sky-500 rounded-lg px-4 py-2.5 text-sm outline-none text-left" dir="ltr">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-2">الموقع الحالي الآن (Current Location)</label>
          <input type="text" id="currentLoc" placeholder="e.g. Arar Border / Basra" class="w-full bg-slate-50 text-slate-900 border border-slate-300 focus:border-sky-500 rounded-lg px-4 py-2.5 text-sm outline-none text-left" dir="ltr">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-2">نوع الشحن (Shipment Type)</label>
          <select id="shipmentType" class="w-full bg-slate-50 text-slate-900 border border-slate-300 focus:border-sky-500 rounded-lg px-4 py-2.5 text-sm outline-none font-medium">
            <option value="Sea">Sea Freight 🚢</option>
            <option value="Air">Air Freight ✈️</option>
            <option value="Land">Land Freight 🚛</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-2">تاريخ التحديث (Update Date)</label>
          <input type="date" id="lastUpdate" class="w-full bg-slate-50 text-slate-900 border border-slate-300 focus:border-sky-500 rounded-lg px-4 py-2.5 text-sm outline-none">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-2">عدد الطرود / الوزن (Packages / Weight)</label>
          <input type="text" id="packages" placeholder="e.g. 12 Cartons / 450 Kg" class="w-full bg-slate-50 text-slate-900 border border-slate-300 focus:border-sky-500 rounded-lg px-4 py-2.5 text-sm outline-none text-left" dir="ltr">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-2">ميناء الترانزيت (Transhipment Port)</label>
          <input type="text" id="transhipment" placeholder="e.g. Khor Fakkan / Direct" class="w-full bg-slate-50 text-slate-900 border border-slate-300 focus:border-sky-500 rounded-lg px-4 py-2.5 text-sm outline-none text-left" dir="ltr">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-2">حالة الشحنة الحالية (Status)</label>
          <select id="status" class="w-full bg-slate-50 text-slate-900 border border-slate-300 focus:border-sky-500 rounded-lg px-4 py-2.5 text-sm outline-none font-medium">
            <option value="Shipment Received">📦 Shipment Received (تم استلام الشحنة)</option>
            <option value="In Transit (Sea)">🚢 In Transit (في الطريق - باخرة)</option>
            <option value="In Transit (Land)">🚛 In Transit (في الطريق - سيارة/شاحنة)</option>
            <option value="Arrived at Port">⚓ Arrived at Port (وصلت الميناء)</option>
            <option value="Arrived at Airport">✈️ Arrived at Airport (وصلت المطار)</option>
            <option value="Under Customs Clearance">🛃 Under Customs Clearance (قيد التخليص الجمركي)</option>
            <option value="Out for Delivery">🚚 Out for Delivery (جاهزة للتسليم / قيد التوصيل)</option>
            <option value="Delivered Successfully">✅ Delivered Successfully (تم التسليم بنجاح)</option>
          </select>
        </div>

        <div class="md:col-span-2">
          <label class="block text-xs font-bold text-slate-700 uppercase mb-2">تفاصيل/ملاحظة الحدث الحالي (Event Details)</label>
          <textarea id="statusDesc" rows="3" placeholder="e.g. Ship arrived at Arar border crossing for inspection." class="w-full bg-slate-50 text-slate-900 border border-slate-300 focus:border-sky-500 rounded-lg px-4 py-2.5 text-sm outline-none text-left" dir="ltr"></textarea>
        </div>

        <div class="md:col-span-2 pt-2">
          <button type="submit" id="saveBtn" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 px-6 rounded-xl transition flex items-center justify-center gap-2 shadow-sm">
            <i class="fa-solid fa-plus-circle"></i>
            <span>إضافة الحدث إلى الخط الزمني للشحنة</span>
          </button>
        </div>

      </form>
    </div>
  </main>

  <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500 font-medium">
    Mariam Basim s.A
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBAIoX7icGAK8pIMspYba58SfO5O6cOabY",
      authDomain: "home-wonderland.firebaseapp.com",
      databaseURL: "https://home-wonderland-default-rtdb.firebaseio.com",
      projectId: "home-wonderland",
      storageBucket: "home-wonderland.firebasestorage.app",
      messagingSenderId: "911419710716",
      appId: "1:911419710716:web:9ba36be5dd456b9f81cb79"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    document.getElementById('lastUpdate').value = new Date().toISOString().split('T')[0];

    document.getElementById('shipmentForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const trackingCode = document.getElementById('trackingCode').value.trim();
      if (!trackingCode) { alert("يرجى إدخال رقم الشحنة."); return; }

      const newEvent = {
        date: document.getElementById('lastUpdate').value,
        location: document.getElementById('currentLoc').value.trim() || "In Transit",
        status: document.getElementById('status').value,
        desc: document.getElementById('statusDesc').value.trim() || "Status updated."
      };

      const shipmentRef = ref(db, 'shipments/' + trackingCode);

      try {
        // جلب الأحداث السابقة إن وجدت
        const snapshot = await get(shipmentRef);
        let existingEvents = [];

        if (snapshot.exists()) {
          const oldData = snapshot.val();
          if (oldData.timelineEvents && Array.isArray(oldData.timelineEvents)) {
            existingEvents = oldData.timelineEvents;
          }
        }

        // إضافة الحدث الجديد في البداية (الأحدث أولاً)
        const updatedTimeline = [newEvent, ...existingEvents];

        const shipmentData = {
          customerName: document.getElementById('customerName').value.trim(),
          from: document.getElementById('fromLoc').value.trim(),
          to: document.getElementById('toLoc').value.trim(),
          currentLoc: document.getElementById('currentLoc').value.trim(),
          shipmentType: document.getElementById('shipmentType').value,
          lastUpdate: document.getElementById('lastUpdate').value,
          packages: document.getElementById('packages').value.trim(),
          transhipment: document.getElementById('transhipment').value.trim(),
          status: document.getElementById('status').value,
          statusDesc: document.getElementById('statusDesc').value.trim(),
          timelineEvents: updatedTimeline
        };

        await set(shipmentRef, shipmentData);
        alert("تم إضافة التحديث الجديد للخط الزمني بنجاح!");
        document.getElementById('statusDesc').value = '';

      } catch (err) {
        console.error(err);
        alert("حدث خطأ أثناء حفظ التحديث.");
      }
    });
  </script>
</body>
</html>
