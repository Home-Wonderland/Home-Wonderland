<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Wonderland - Cargo Tracking</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Leaflet Map CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { 
      font-family: 'Inter', sans-serif; 
      background-color: #f8fafc;
      color: #0f172a;
    }
    
    #map { 
      height: 380px; 
      width: 100%; 
      border-radius: 0.75rem; 
      z-index: 1; 
      overflow: hidden; 
    }

    @media (max-width: 640px) {
      #map {
        height: 260px;
      }
    }
    
    .leaflet-tile-container img {
      filter: brightness(0.97) contrast(1.1) hue-rotate(180deg) invert(0.9) saturate(1.8);
    }

    .custom-ship-icon {
      display: flex; align-items: center; justify-content: center;
      background: #0284c7; color: white; border-radius: 50%; border: 3px solid #ffffff;
      box-shadow: 0 6px 18px rgba(2, 132, 199, 0.35); font-size: 18px;
      animation: pulse-ring 2s infinite;
    }
    .custom-start-pin, .custom-end-pin {
      display: flex; align-items: center; justify-content: center;
      background: #0f172a; color: white; border-radius: 50%;
      border: 2px solid white; font-size: 11px; box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    @keyframes pulse-ring {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(2, 132, 199, 0.6); }
      70% { transform: scale(1.15); box-shadow: 0 0 0 12px rgba(2, 132, 199, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(2, 132, 199, 0); }
    }

    .step-active { background-color: #0284c7 !important; color: white !important; border-color: #0284c7 !important; }
    .step-text-active { color: #0284c7 !important; font-weight: 600; }
    .line-active { background-color: #0284c7 !important; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden">

  <!-- Header عالمي -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 sm:h-20 flex items-center justify-between">
      <button class="text-slate-600 hover:text-slate-900 text-lg sm:text-xl focus:outline-none">
        <i class="fa-solid fa-bars"></i>
      </button>

      <div class="flex flex-col items-center">
        <img src="WhatsApp Image 2026-09-25 at 18.32.28.jpeg" alt="Home Wonderland Logo" class="h-8 sm:h-10 object-contain">
      </div>

      <div class="flex items-center space-x-3 sm:space-x-5 text-slate-600 text-base sm:text-lg">
        <button class="hover:text-slate-900 transition"><i class="fa-solid fa-magnifying-glass"></i></button>
        <button class="hover:text-slate-900 transition hidden sm:inline-block"><i class="fa-solid fa-location-dot"></i></button>
        <button class="hover:text-slate-900 transition"><i class="fa-solid fa-globe"></i></button>
        <button class="hover:text-slate-900 transition"><i class="fa-regular fa-user"></i></button>
      </div>
    </div>
  </header>

  <!-- Main Tracking Section -->
  <main class="flex-grow max-w-4xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-10 space-y-6 sm:space-y-10">
    
    <div class="text-center space-y-2">
      <span class="text-[10px] sm:text-xs font-semibold uppercase tracking-wider text-slate-400">Track a shipment</span>
      <h1 class="text-2xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">Tracking</h1>
      <div class="w-10 h-1 bg-amber-400 mx-auto rounded-full mt-2"></div>
    </div>

    <!-- Search Box -->
    <div class="bg-white p-4 sm:p-8 rounded-2xl border border-slate-200/80 shadow-sm space-y-4 sm:space-y-6">
      <div class="flex flex-col sm:flex-row items-center justify-center gap-3 sm:gap-6 text-xs sm:text-sm text-slate-500">
        <div class="flex items-center space-x-2">
          <input type="radio" id="containerRadio" name="searchType" value="bl" checked class="accent-sky-600 w-4 h-4 cursor-pointer">
          <label for="containerRadio" class="cursor-pointer font-medium">Container / Bill of Lading Number</label>
        </div>
        <div class="flex items-center space-x-2">
          <input type="radio" id="bookingRadio" name="searchType" value="booking" class="accent-sky-600 w-4 h-4 cursor-pointer">
          <label for="bookingRadio" class="cursor-pointer font-medium">Booking Number</label>
        </div>
      </div>

      <div class="relative max-w-2xl mx-auto flex flex-col sm:block gap-2">
        <div class="relative w-full">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 text-sm">
            <i class="fa-solid fa-magnifying-glass"></i>
          </div>
          <input type="text" id="trackingInput" placeholder="Enter a Container / Bill of Lading Number" 
            class="w-full bg-slate-100/80 hover:bg-slate-100 focus:bg-white text-slate-800 placeholder-slate-400 pl-11 pr-4 sm:pr-32 py-3 sm:py-4 rounded-xl text-xs sm:text-sm font-medium border border-transparent focus:border-sky-500 outline-none transition-all shadow-inner">
        </div>
        <button id="trackBtn" class="w-full sm:w-auto sm:absolute sm:right-1.5 sm:top-1.5 sm:bottom-1.5 bg-slate-900 hover:bg-slate-800 text-white px-6 py-3 sm:py-0 rounded-xl sm:rounded-lg text-xs sm:text-sm font-semibold transition flex items-center justify-center gap-2">
          Search
        </button>
      </div>
    </div>

    <!-- Live Result Container -->
    <div id="resultCard" class="hidden bg-white rounded-2xl border border-slate-200/80 shadow-sm p-4 sm:p-8 space-y-6 sm:space-y-8 transition-all">
      
      <!-- Summary Grid Header (نمط MSC) -->
      <div class="border-b border-slate-200 pb-4 sm:pb-6 space-y-3 sm:space-y-4">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 sm:gap-0">
          <h2 class="text-base sm:text-xl font-bold text-slate-900 tracking-tight break-all">
            BILL OF LADING: <span id="resCodeDisplay" class="text-sky-700"></span>
          </h2>
          <span id="resDate" class="text-[11px] sm:text-xs text-slate-500 font-medium bg-slate-100 px-3 py-1 rounded-full self-start sm:self-auto"></span>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4 bg-slate-50 p-3 sm:p-4 rounded-xl border border-slate-100 text-xs">
          <div>
            <span class="text-slate-400 font-semibold block uppercase text-[10px] sm:text-xs">Shipped From</span>
            <span id="resFrom" class="font-bold text-slate-800 text-xs sm:text-sm break-words"></span>
          </div>
          <div>
            <span class="text-slate-400 font-semibold block uppercase text-[10px] sm:text-xs">Shipped To</span>
            <span id="resTo" class="font-bold text-slate-800 text-xs sm:text-sm break-words"></span>
          </div>
          <div>
            <span class="text-slate-400 font-semibold block uppercase text-[10px] sm:text-xs">Transhipment</span>
            <span id="resTranshipment" class="font-bold text-slate-800 text-xs sm:text-sm break-words">-</span>
          </div>
          <div>
            <span class="text-slate-400 font-semibold block uppercase text-[10px] sm:text-xs">Packages / Weight</span>
            <span id="resPackages" class="font-bold text-slate-800 text-xs sm:text-sm break-words"></span>
          </div>
        </div>
      </div>

      <!-- Current Location Highlight -->
      <div class="bg-slate-900 text-white p-4 sm:p-5 rounded-xl flex items-center justify-between shadow-sm">
        <div class="flex items-center gap-3 sm:gap-4">
          <div class="bg-white/10 p-2.5 sm:p-3 rounded-lg">
            <i class="fa-solid fa-truck-fast text-lg sm:text-xl text-sky-400"></i>
          </div>
          <div>
            <span class="text-[10px] sm:text-xs text-slate-400 uppercase tracking-wider font-semibold block">Current Location</span>
            <span id="resLoc" class="text-base sm:text-lg font-bold"></span>
          </div>
        </div>
        <span class="text-[10px] sm:text-xs bg-sky-500/20 text-sky-300 font-semibold px-2.5 py-1 sm:px-3 sm:py-1.5 rounded-full border border-sky-500/30 whitespace-nowrap">Live Status</span>
      </div>

      <!-- Live Map Route -->
      <div class="space-y-2">
        <span class="text-[10px] sm:text-xs font-semibold text-slate-400 uppercase tracking-wider block">Live Map Route</span>
        <div id="map"></div>
      </div>

      <!-- Vertical Timeline Section (MSC Style) -->
      <div class="space-y-4 pt-4 border-t border-slate-100">
        <h3 class="text-sm sm:text-base font-bold text-slate-900 tracking-tight uppercase">Shipment Timeline & Events</h3>
        
        <div id="timelineContainer" class="relative pl-6 space-y-6 sm:space-y-8 before:absolute before:left-2 before:top-2 before:bottom-2 before:w-0.5 before:bg-amber-400">
          <!-- سيتم توليد نقاط التتبع زمنياً هنا تلقائياً -->
        </div>
      </div>

    </div>

  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-slate-200 py-4 sm:py-6 text-center text-[11px] sm:text-xs text-slate-400 font-medium px-4">
    ©️ Home Wonderland Logistics - All rights reserved
  </footer>

  <!-- Firebase & Logic Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBAIoX7icGAK8pIMspYba58SfO5O6cOabY",
      authDomain: "home-wonderland.firebaseapp.com",
      databaseURL: "https://home-wonderland-default-rtdb.firebaseio.com",
      projectId: "home-wonderland",
      storageBucket: "home-wonderland.firebasestorage.app",
      messagingSenderId: "911419710716",
      appId: "1:911419710716:web:9ba36be5dd456b9f81cb79"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let map = null;
    let markersGroup = L.layerGroup();
    let polyline = null;

    const dictionary = {
      "bsr": [30.5081, 47.7835], "بصرة": [30.5081, 47.7835], "البصرة": [30.5081, 47.7835], "basra": [30.5081, 47.7835],
      "أم قصر": [30.0361, 47.9250], "umm qasr": [30.0361, 47.9250], "ام قصر": [30.0361, 47.9250],
      "dubai": [25.2048, 55.2708], "دبي": [25.2048, 55.2708], "uae": [25.2048, 55.2708],
      "jebel ali": [24.9857, 55.0272], "جبل علي": [24.9857, 55.0272],
      "baghdad": [33.3152, 44.3661], "بغداد": [33.3152, 44.3661],
      "xiamen": [24.4798, 118.0819], "shanghai": [31.2304, 121.4737], "khor fakkan": [25.3313, 56.3420]
    };

    async function fetchCoords(loc) {
      if (!loc) return null;
      const clean = loc.toLowerCase().trim();
      for (const k in dictionary) {
        if (clean.includes(k)) return dictionary[k];
      }
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(loc)}`);
        const resData = await res.json();
        if (resData && resData.length > 0) {
          return [parseFloat(resData[0].lat), parseFloat(resData[0].lon)];
        }
      } catch (err) {}
      return null;
    }

    async function renderRouteMap(fromLoc, toLoc, currentLoc, shipType) {
      const startC = await fetchCoords(fromLoc) || [25.2048, 55.2708];
      const endC = await fetchCoords(toLoc) || [30.0361, 47.9250];
      const liveC = await fetchCoords(currentLoc) || startC;

      if (!map) {
        map = L.map('map');
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(map);
        markersGroup.addTo(map);
      }

      markersGroup.clearLayers();

      const startIcon = L.divIcon({ className: 'custom-start-pin', html: '<i class="fa-solid fa-play"></i>', iconSize: [24, 24] });
      const endIcon = L.divIcon({ className: 'custom-end-pin', html: '<i class="fa-solid fa-flag-checkered"></i>', iconSize: [24, 24] });

      L.marker(startC, { icon: startIcon }).addTo(markersGroup);
      L.marker(endC, { icon: endIcon }).addTo(markersGroup);

      if (polyline) map.removeLayer(polyline);
      polyline = L.polyline([startC, liveC, endC], { color: '#0284c7', weight: 3, opacity: 0.8, dashArray: '5, 8' }).addTo(map);

      let iconClass = "fa-ship";
      if (shipType === "Air" || shipType === "جوي") iconClass = "fa-plane";
      if (shipType === "Land" || shipType === "بري") iconClass = "fa-truck";

      const currentIcon = L.divIcon({
        className: 'custom-ship-icon',
        html: `<i class="fa-solid ${iconClass}"></i>`,
        iconSize: [42, 42],
        iconAnchor: [21, 21]
      });

      L.marker(liveC, { icon: currentIcon }).addTo(markersGroup).bindPopup(`<b>${currentLoc || 'Current'}</b>`).openPopup();
      
      setTimeout(() => { 
        map.invalidateSize();
        map.fitBounds(L.latLngBounds([startC, endC, liveC]), { padding: [30, 30] });
      }, 300);
    }

    function renderTimeline(data) {
      const container = document.getElementById('timelineContainer');
      container.innerHTML = '';

      // أحداث افتراضية مبنية على البيانات أو تاريخ التحديث
      const events = data.timelineEvents || [
        { date: data.lastUpdate || "Recent", location: data.currentLoc || "-", status: data.status || "In Transit", desc: data.statusDesc || "Shipment status updated" },
        { date: "Initial Processing", location: data.from || "Origin Port", status: "Loaded on Vessel", desc: "Container loaded and cleared for export" }
      ];

      events.forEach((ev, idx) => {
        const item = document.createElement('div');
        item.className = "relative flex flex-col space-y-1";
        
        item.innerHTML = `
          <div class="absolute -left-[31px] top-1.5 w-3.5 h-3.5 rounded-full bg-amber-400 border-2 border-white shadow-sm"></div>
          <span class="text-[11px] sm:text-xs font-semibold text-slate-400">${ev.date}</span>
          <span class="text-xs sm:text-sm font-bold text-slate-800">${ev.location}</span>
          <span class="text-[11px] sm:text-xs font-semibold text-sky-700 uppercase">${ev.status}</span>
          <p class="text-xs text-slate-500">${ev.desc}</p>
        `;
        container.appendChild(item);
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      const trackBtn = document.getElementById('trackBtn');
      const trackingInput = document.getElementById('trackingInput');

      if (trackBtn) {
        trackBtn.addEventListener('click', (e) => {
          e.preventDefault();
          const code = trackingInput ? trackingInput.value.trim() : '';
          if (!code) { alert("Please enter tracking number"); return; }

          get(child(ref(db), 'shipments')).then((snapshot) => {
            if (snapshot.exists()) {
              const shipments = snapshot.val();
              const matchedKey = Object.keys(shipments).find(k => k.trim().toLowerCase() === code.toLowerCase());

              if (matchedKey) {
                const data = shipments[matchedKey];
                
                document.getElementById('resCodeDisplay').innerText = matchedKey;
                document.getElementById('resFrom').innerText = data.from || '-';
                document.getElementById('resTo').innerText = data.to || '-';
                document.getElementById('resLoc').innerText = data.currentLoc || '-';
                document.getElementById('resDate').innerText = data.lastUpdate ? `Updated: ${data.lastUpdate}` : '';
                document.getElementById('resPackages').innerText = data.packages || '-';
                document.getElementById('resTranshipment').innerText = data.transhipment || 'Direct';

                document.getElementById('resultCard').classList.remove('hidden');

                renderRouteMap(data.from, data.to, data.currentLoc, data.shipmentType);
                renderTimeline(data);

              } else { alert("Tracking number not found."); }
            } else { alert("No registered shipments found."); }
          }).catch(() => { alert("Error fetching tracking details."); });
        });
      }
    });
  </script>
</body>
</html>
