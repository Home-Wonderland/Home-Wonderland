<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Wonderland - Cargo Tracking</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Leaflet Map CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { 
      font-family: 'Inter', sans-serif; 
      background-color: #f8fafc;
      color: #0f172a;
    }
    
    /* الخريطة */
    #map { 
      height: 400px; 
      width: 100%; 
      border-radius: 0.75rem; 
      z-index: 1; 
      overflow: hidden; 
    }
    
    .leaflet-tile-container img {
      filter: brightness(0.97) contrast(1.1) hue-rotate(180deg) invert(0.9) saturate(1.8);
    }

    /* علامات الخريطة */
    .custom-ship-icon {
      display: flex; align-items: center; justify-content: center;
      background: #0284c7; color: white; border-radius: 50%; border: 3px solid #ffffff;
      box-shadow: 0 6px 18px rgba(2, 132, 199, 0.35); font-size: 18px;
      animation: pulse-ring 2s infinite;
    }
    .custom-start-pin, .custom-end-pin {
      display: flex; align-items: center; justify-content: center;
      background: #0f172a; color: white; border-radius: 50%;
      border: 2px solid white; font-size: 11px; box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    @keyframes pulse-ring {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(2, 132, 199, 0.6); }
      70% { transform: scale(1.15); box-shadow: 0 0 0 12px rgba(2, 132, 199, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(2, 132, 199, 0); }
    }

    /* أسلوب محدد الخيارات Radio */
    .custom-radio:checked + label {
      color: #0f172a;
      font-weight: 600;
    }
    
    /* تصميم محدد الشحنة Active Steps */
    .step-active { background-color: #0284c7 !important; color: white !important; border-color: #0284c7 !important; }
    .step-text-active { color: #0284c7 !important; font-weight: 600; }
    .line-active { background-color: #0284c7 !important; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <!-- Header عالمي بأسلوب MSC -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      
      <!-- القائمة الجانبية Left Menu Icon -->
      <button class="text-slate-600 hover:text-slate-900 text-xl focus:outline-none">
        <i class="fa-solid fa-bars"></i>
      </button>

      <!-- الشعار المنتصف Brand Logo -->
      <div class="flex flex-col items-center">
        <img src="WhatsApp Image 2026-09-25 at 18.32.28.jpeg" alt="Home Wonderland Logo" class="h-10 object-contain">
      </div>

      <!-- الأيقونات اليمين Header Tools -->
      <div class="flex items-center space-x-5 text-slate-600 text-lg">
        <button class="hover:text-slate-900 transition"><i class="fa-solid fa-magnifying-glass"></i></button>
        <button class="hover:text-slate-900 transition"><i class="fa-solid fa-location-dot"></i></button>
        <button class="hover:text-slate-900 transition"><i class="fa-solid fa-globe"></i></button>
        <button class="hover:text-slate-900 transition"><i class="fa-regular fa-user"></i></button>
      </div>

    </div>
  </header>

  <!-- Main Tracking Section -->
  <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-12 md:py-16 space-y-12">
    
    <!-- Title & Subtitle -->
    <div class="text-center space-y-2">
      <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Track a shipment</span>
      <h1 class="text-3xl md:text-4xl font-extrabold text-slate-900 tracking-tight">Tracking</h1>
      <div class="w-10 h-1 bg-amber-400 mx-auto rounded-full mt-2"></div>
    </div>

    <!-- Radio Options & Search Field (MSC Style) -->
    <div class="bg-white p-8 rounded-2xl border border-slate-200/80 shadow-sm space-y-6">
      
      <!-- Radio Selection -->
      <div class="flex flex-wrap items-center justify-center gap-6 text-sm text-slate-500">
        <div class="flex items-center space-x-2">
          <input type="radio" id="containerRadio" name="searchType" value="bl" checked class="accent-sky-600 w-4 h-4 cursor-pointer">
          <label for="containerRadio" class="cursor-pointer font-medium">Container / Bill of Lading Number</label>
        </div>
        <div class="flex items-center space-x-2">
          <input type="radio" id="bookingRadio" name="searchType" value="booking" class="accent-sky-600 w-4 h-4 cursor-pointer">
          <label for="bookingRadio" class="cursor-pointer font-medium">Booking Number</label>
        </div>
      </div>

      <!-- Search Input Box -->
      <div class="relative max-w-2xl mx-auto">
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
          <i class="fa-solid fa-magnifying-glass"></i>
        </div>
        <input type="text" id="trackingInput" placeholder="Enter a Container / Bill of Lading Number" 
          class="w-full bg-slate-100/80 hover:bg-slate-100 focus:bg-white text-slate-800 placeholder-slate-400 pl-11 pr-32 py-4 rounded-xl text-sm font-medium border border-transparent focus:border-sky-500 outline-none transition-all shadow-inner">
        <button id="trackBtn" class="absolute right-1.5 top-1.5 bottom-1.5 bg-slate-900 hover:bg-slate-800 text-white px-6 rounded-lg text-sm font-semibold transition flex items-center gap-2">
          Search
        </button>
      </div>

    </div>

    <!-- Live Result Container -->
    <div id="resultCard" class="hidden bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6 md:p-8 space-y-8 transition-all">
      
      <!-- Details Header -->
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-100 pb-6">
        <div>
          <span class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Tracking Code</span>
          <h3 id="resCodeDisplay" class="text-xl font-bold text-slate-900"></h3>
        </div>
        <div class="text-left sm:text-right">
          <span class="text-xs uppercase tracking-wider text-slate-400 font-semibold block"><i class="fa-regular fa-clock"></i> Last Updated</span>
          <span id="resDate" class="text-sm font-medium text-slate-700"></span>
        </div>
      </div>

      <!-- Origin & Destination -->
      <div class="grid grid-cols-2 gap-4 bg-slate-50 p-6 rounded-xl text-center border border-slate-100">
        <div>
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-1">Origin</span>
          <span id="resFrom" class="text-base md:text-lg font-bold text-slate-800"></span>
        </div>
        <div class="border-l border-slate-200">
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-1">Destination</span>
          <span id="resTo" class="text-base md:text-lg font-bold text-slate-800"></span>
        </div>
      </div>

      <!-- Progress Line -->
      <div class="space-y-4">
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider block">Shipment Status</span>
        <div class="relative flex items-center justify-between px-4 sm:px-8">
          <div class="absolute left-8 right-8 top-4 h-0.5 bg-slate-200 -z-0">
            <div id="progressLine" class="h-full bg-slate-200 transition-all duration-500" style="width: 0%;"></div>
          </div>

          <div class="flex flex-col items-center z-10">
            <div id="step1" class="w-8 h-8 rounded-full bg-slate-200 text-slate-600 font-semibold text-xs flex items-center justify-center border-2 border-white transition-all">1</div>
            <span id="stepText1" class="text-xs font-medium text-slate-400 mt-2">Received</span>
          </div>
          <div class="flex flex-col items-center z-10">
            <div id="step2" class="w-8 h-8 rounded-full bg-slate-200 text-slate-600 font-semibold text-xs flex items-center justify-center border-2 border-white transition-all">2</div>
            <span id="stepText2" class="text-xs font-medium text-slate-400 mt-2">In Transit</span>
          </div>
          <div class="flex flex-col items-center z-10">
            <div id="step3" class="w-8 h-8 rounded-full bg-slate-200 text-slate-600 font-semibold text-xs flex items-center justify-center border-2 border-white transition-all">3</div>
            <span id="stepText3" class="text-xs font-medium text-slate-400 mt-2">Clearance</span>
          </div>
          <div class="flex flex-col items-center z-10">
            <div id="step4" class="w-8 h-8 rounded-full bg-slate-200 text-slate-600 font-semibold text-xs flex items-center justify-center border-2 border-white transition-all">4</div>
            <span id="stepText4" class="text-xs font-medium text-slate-400 mt-2">Delivered</span>
          </div>
        </div>
      </div>

      <!-- Current Location Highlight -->
      <div class="bg-slate-900 text-white p-5 rounded-xl flex items-center justify-between shadow-sm">
        <div class="flex items-center gap-4">
          <div class="bg-white/10 p-3 rounded-lg">
            <i class="fa-solid fa-truck-fast text-xl text-sky-400"></i>
          </div>
          <div>
            <span class="text-xs text-slate-400 uppercase tracking-wider font-semibold block">Current Location</span>
            <span id="resLoc" class="text-lg font-bold"></span>
          </div>
        </div>
        <span class="text-xs bg-sky-500/20 text-sky-300 font-semibold px-3 py-1.5 rounded-full border border-sky-500/30">Live Tracking</span>
      </div>

      <!-- Map Display -->
      <div class="space-y-2">
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider block">Live Map Route</span>
        <div id="map"></div>
      </div>

      <!-- Cargo Specs -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
        <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-1">Packages / Weight</span>
          <span id="resPackages" class="font-bold text-slate-800 text-sm md:text-base"></span>
        </div>
        <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-1">Status Remarks</span>
          <div id="resStatus" class="font-bold text-slate-800 text-sm md:text-base"></div>
          <div id="resStatusDesc" class="text-xs text-slate-500 mt-0.5"></div>
        </div>
      </div>

    </div>

  </main>

  <!-- Minimal Footer -->
  <footer class="bg-white border-t border-slate-200 py-6 mt-12 text-center text-xs text-slate-400 font-medium">
    ©️ Home Wonderland Logistics - All rights reserved
  </footer>

  <!-- Firebase & Logic Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBAIoX7icGAK8pIMspYba58SfO5O6cOabY",
      authDomain: "home-wonderland.firebaseapp.com",
      databaseURL: "https://home-wonderland-default-rtdb.firebaseio.com",
      projectId: "home-wonderland",
      storageBucket: "home-wonderland.firebasestorage.app",
      messagingSenderId: "911419710716",
      appId: "1:911419710716:web:9ba36be5dd456b9f81cb79"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let map = null;
    let markersGroup = L.layerGroup();
    let polyline = null;

    const dictionary = {
      "bsr": [30.5081, 47.7835], "بصرة": [30.5081, 47.7835], "البصرة": [30.5081, 47.7835], "basra": [30.5081, 47.7835],
      "أم قصر": [30.0361, 47.9250], "umm qasr": [30.0361, 47.9250], "ام قصر": [30.0361, 47.9250],
      "dubai": [25.2048, 55.2708], "دبي": [25.2048, 55.2708], "إمارات": [25.2048, 55.2708], "uae": [25.2048, 55.2708],
      "jebel ali": [24.9857, 55.0272], "جبل علي": [24.9857, 55.0272],
      "بغداد": [33.3152, 44.3661], "baghdad": [33.3152, 44.3661],
      "عرعر": [30.9083, 41.1389], "north rumella": [30.5500, 47.4500], "الرميلة": [30.5500, 47.4500],
      "china": [31.2304, 121.4737], "الصين": [31.2304, 121.4737], "guangzhou": [23.1291, 113.2644], "كوانزو": [23.1291, 113.2644],
      "italy": [41.8719, 12.5674], "إيطاليا": [41.8719, 12.5674],
      "turkey": [38.9637, 35.2433], "تركيا": [38.9637, 35.2433], "istanbul": [41.0082, 28.9784], "اسطنبول": [41.0082, 28.9784]
    };

    async function fetchCoords(loc) {
      if (!loc) return null;
      const clean = loc.toLowerCase().trim();
      
      for (const k in dictionary) {
        if (clean.includes(k)) return dictionary[k];
      }

      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(loc)}`);
        const resData = await res.json();
        if (resData && resData.length > 0) {
          return [parseFloat(resData[0].lat), parseFloat(resData[0].lon)];
        }
      } catch (err) {
        console.log("Geocoding error", err);
      }
      return null;
    }

    async function renderRouteMap(fromLoc, toLoc, currentLoc, shipType) {
      const startC = await fetchCoords(fromLoc) || [25.2048, 55.2708];
      const endC = await fetchCoords(toLoc) || [30.0361, 47.9250];
      const liveC = await fetchCoords(currentLoc) || startC;

      if (!map) {
        map = L.map('map');
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 18,
          attribution: '©️ OpenStreetMap'
        }).addTo(map);
        markersGroup.addTo(map);
      }

      markersGroup.clearLayers();

      const startIcon = L.divIcon({ className: 'custom-start-pin', html: '<i class="fa-solid fa-play"></i>', iconSize: [24, 24] });
      const endIcon = L.divIcon({ className: 'custom-end-pin', html: '<i class="fa-solid fa-flag-checkered"></i>', iconSize: [24, 24] });

      L.marker(startC, { icon: startIcon }).addTo(markersGroup).bindPopup(`<b>From:</b> ${fromLoc}`);
      L.marker(endC, { icon: endIcon }).addTo(markersGroup).bindPopup(`<b>To:</b> ${toLoc}`);

      if (polyline) map.removeLayer(polyline);
      polyline = L.polyline([startC, liveC, endC], {
        color: '#0284c7',
        weight: 3,
        opacity: 0.8,
        dashArray: '5, 8'
      }).addTo(map);

      let iconClass = "fa-ship";
      if (shipType === "Air" || shipType === "جوي") iconClass = "fa-plane";
      if (shipType === "Land" || shipType === "بري") iconClass = "fa-truck";

      const currentIcon = L.divIcon({
        className: 'custom-ship-icon',
        html: `<i class="fa-solid ${iconClass}"></i>`,
        iconSize: [42, 42],
        iconAnchor: [21, 21]
      });

      L.marker(liveC, { icon: currentIcon }).addTo(markersGroup)
        .bindPopup(`<div style="text-align:center;"><b>${currentLoc || 'Current Location'}</b></div>`).openPopup();

      const bounds = L.latLngBounds([startC, endC, liveC]);
      map.fitBounds(bounds, { padding: [50, 50] });

      setTimeout(() => { map.invalidateSize(); }, 300);
    }

    function updateProgress(statusText) {
      for (let i = 1; i <= 4; i++) {
        const step = document.getElementById('step' + i);
        const text = document.getElementById('stepText' + i);
        if (step) step.className = "w-8 h-8 rounded-full bg-slate-200 text-slate-600 font-semibold text-xs flex items-center justify-center border-2 border-white transition-all";
        if (text) text.className = "text-xs font-medium text-slate-400 mt-2";
      }

      const line = document.getElementById('progressLine');
      let stepNumber = 1;

      if (!statusText) statusText = '';
      
      if (statusText.includes('استلام') || statusText.includes('Received')) stepNumber = 1;
      else if (statusText.includes('قيد الشحن') || statusText.includes('Transit') || statusText.includes('الميناء')) stepNumber = 2;
      else if (statusText.includes('تخليص') || statusText.includes('Clearance')) stepNumber = 3;
      else if (statusText.includes('تسليم') || statusText.includes('Delivered') || statusText.includes('جاهزة')) stepNumber = 4;

      for (let i = 1; i <= stepNumber; i++) {
        const step = document.getElementById('step' + i);
        const text = document.getElementById('stepText' + i);
        if (step) step.classList.add('step-active');
        if (text) text.classList.add('step-text-active');
      }

      if (line) {
        if (stepNumber === 1) line.style.width = '0%';
        if (stepNumber === 2) line.style.width = '33%';
        if (stepNumber === 3) line.style.width = '66%';
        if (stepNumber === 4) line.style.width = '100%';
        line.classList.add('line-active');
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const trackBtn = document.getElementById('trackBtn');
      const trackingInput = document.getElementById('trackingInput');

      if (trackBtn) {
        trackBtn.addEventListener('click', (e) => {
          e.preventDefault();
          const code = trackingInput ? trackingInput.value.trim() : '';
          if (!code) {
            alert("Please enter tracking number");
            return;
          }

          get(child(ref(db), 'shipments')).then((snapshot) => {
            if (snapshot.exists()) {
              const shipments = snapshot.val();
              const matchedKey = Object.keys(shipments).find(
                k => k.trim().toLowerCase() === code.toLowerCase()
              );

              if (matchedKey) {
                const data = shipments[matchedKey];
                
                if (document.getElementById('resCodeDisplay')) document.getElementById('resCodeDisplay').innerText = matchedKey;
                if (document.getElementById('resFrom')) document.getElementById('resFrom').innerText = data.from || '-';
                if (document.getElementById('resTo')) document.getElementById('resTo').innerText = data.to || '-';
                if (document.getElementById('resLoc')) document.getElementById('resLoc').innerText = data.currentLoc || '-';
                if (document.getElementById('resStatus')) document.getElementById('resStatus').innerText = data.status || '-';
                if (document.getElementById('resDate')) document.getElementById('resDate').innerText = data.lastUpdate || '-';
                if (document.getElementById('resPackages')) document.getElementById('resPackages').innerText = data.packages || '-';
                if (document.getElementById('resStatusDesc')) document.getElementById('resStatusDesc').innerText = data.statusDesc || '-';

                updateProgress(data.status);

                const resultCard = document.getElementById('resultCard');
                if (resultCard) {
                  resultCard.classList.remove('hidden');
                }

                renderRouteMap(data.from, data.to, data.currentLoc, data.shipmentType);

              } else {
                alert("Tracking number not found, please check again.");
              }
            } else {
              alert("No registered shipments found.");
            }
          }).catch((error) => {
            alert("Error fetching tracking details.");
          });
        });
      }
    });
  </script>
</body>
</html>
